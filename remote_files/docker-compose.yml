version: '3.4'

networks:
  chirp-network:
    name: chirp-network

services:

  # This is for running database locally.
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - chirp-network

  chirpwebservice:
    image: ituminitwit/minitwitimage
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: minitwit
    environment:
      - DB_STRING=${DB_STRING}
      - loki=http://loki:3100
    ports:
      - "8080:80"
    depends_on:
      - db
      - grafana
      - prometheus
    networks:
      - chirp-network
  
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - chirp-network

  grafana:
    image: grafana/grafana:10.2.4
    ports:
      - "3000:3000"
    networks:
      - chirp-network
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - chirp-network